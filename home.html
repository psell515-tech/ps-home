
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Patrick Sell</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --black: #000;
      --white: #fff;
      --dim: rgba(255,255,255,0.5);
      --border: rgba(255,255,255,0.1);
      --accent: #e8ff00;
      --header-h: 56px;
    }

    html, body {
      background: var(--black);
      color: var(--white);
      height: 100%;
      min-height: 100vh;
      font-family: 'DM Mono', monospace;
      overflow: hidden;
    }

    /* ── HEADER ── */
    #header-container {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: var(--header-h);
      z-index: 100;
    }

    #header {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      border-bottom: 1px solid var(--border);
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    #site-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 22px;
      letter-spacing: 0.12em;
      color: var(--white);
      text-decoration: none;
    }

    #site-title span { color: var(--accent); }

    #nav-left {
      display: flex;
      align-items: center;
      gap: 28px;
    }

    .nav-link {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--dim);
      text-decoration: none;
      transition: color 0.2s ease;
      position: relative;
    }

    .nav-link::after {
      content: '';
      position: absolute;
      bottom: -3px;
      left: 0;
      width: 0;
      height: 1px;
      background: var(--accent);
      transition: width 0.25s ease;
    }

    .nav-link:hover { color: var(--white); }
    .nav-link:hover::after { width: 100%; }

    /* ── FULLSCREEN VIDEO ── */
    #video-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    #mainVideo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* subtle scanline */
    #video-bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.08) 2px,
        rgba(0,0,0,0.08) 4px
      );
      pointer-events: none;
      z-index: 1;
    }

    /* vignette */
    #video-bg::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.75) 100%);
      pointer-events: none;
      z-index: 1;
    }

    /* ── OVERLAY TEXT ── */
    #overlay {
      position: fixed;
      bottom: 40px;
      left: 0;
      right: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      animation: fadeUp 1s 0.3s ease both;
    }

    #updateNotice {
      font-size: 11px;
      letter-spacing: 0.14em;
      color: rgba(255,255,255,0.55);
      text-align: center;
      line-height: 1.7;
    }

    #updateNotice strong {
      color: var(--accent);
      font-weight: 400;
    }

    #check-back {
      font-size: 10px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.2);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 480px) {
      #header { padding: 0 16px; }
      #nav-left { gap: 18px; }
      .nav-link { font-size: 10px; }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <div id="header-container"></div>
  <script>
    fetch("/header.html")
      .then(r => r.text())
      .then(html => {
        document.getElementById("header-container").innerHTML = html;
      });
  </script>

  <!-- FULLSCREEN VIDEO -->
  <div id="video-bg">
    <video id="mainVideo" playsinline autoplay muted></video>
  </div>

  <!-- OVERLAY -->
  <div id="overlay">
    <div id="updateNotice">
      New creative updates are planned for <strong>June 2026</strong>.<br>
      Thank you for visiting.
    </div>
    <div id="check-back">Check back soon</div>
  </div>

  <script>
    const video = document.getElementById("mainVideo");
    const CLIP_1 = "https://hptombstone2work.psell515.workers.dev/r2/patandcroc-ai.mp4?token=my_subway";
    const CLIP_2 = "https://hptombstone2work.psell515.workers.dev/r2/ps-title-sequence.mp4?token=my_subway";
    let state = 1;

    function playClip1() {
      state = 1;
      video.loop = false;
      video.src = CLIP_1;
      video.play();
    }

    function playClip2() {
      state = 2;
      video.loop = false;
      video.src = CLIP_2;
      video.play();
    }

    playClip1();
    video.addEventListener("ended", () => {
      if (state === 1) playClip2();
      else playClip1();
    });
  </script>

</body>
</html>
