<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Patrick Sell - Family Album</title>

<style>
  body {
    margin: 0;
    padding: 0;
    background: #000;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
  }

  /* Shared header styles */
  #header {
    width: 100%;
    background: rgba(255,255,255,0.06);
    border-bottom: 1px solid rgba(255,255,255,0.12);
    backdrop-filter: blur(8px);
    padding: 14px 20px;
    box-sizing: border-box;
    position: relative;
    z-index: 10;

    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  #nav-left {
    display: flex;
    align-items: center;
    gap: 22px;
  }

  .nav-link {
    color: #fff;
    font-size: 16px;
    font-weight: 500;
    text-decoration: none;
    opacity: 0.85;
    transition: opacity 0.2s ease;
  }

  .nav-link:hover {
    opacity: 1;
  }

  /* Page content */
  #player-wrapper {
    margin-top: 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  #mainVideo {
    width: 272px;
    height: 459px;
    border-radius: 14px;
    object-fit: contain;
    background: #000;
    box-shadow: 0 0 18px rgba(0,0,0,0.35);
  }

  #updateNotice {
    margin-top: 18px;
    font-size: 14px;
    letter-spacing: 0.4px;
    color: rgba(255,255,255,0.65);
    text-align: center;
    font-weight: 300;
    max-width: 280px;
    line-height: 1.45;
  }

  #form-wrapper {
    margin-top: 40px;
    width: 90%;
    max-width: 420px;
    text-align: center;
    color: #888;
    font-size: 14px;
  }
</style>
</head>

<body>

<!-- ⭐ SHARED HEADER -->
<div id="header-container"></div>

<script>
  fetch("/header.html")
    .then(r => r.text())
    .then(html => {
      document.getElementById("header-container").innerHTML = html;
    });
</script>

<!-- ⭐ FAMILY PAGE CONTENT -->
<div id="player-wrapper">
  <video id="mainVideo" playsinline autoplay muted></video>

  <div id="updateNotice">
    New creative updates are planned for <strong>Summer 2026</strong>.  
  </div>
</div>

<div id="form-wrapper">
 Check Back Soon.
</div>

<script>
  const video = document.getElementById("mainVideo");

  const CLIP_1 = "https://hptombstone2work.psell515.workers.dev/r2/free-throw.mp4?token=my_subway";
  const CLIP_2 = "https://hptombstone2work.psell515.workers.dev/r2/steamboat_jan25.mp4?token=my_subway";

  let state = 1;

  function playClip1() {
    state = 1;
    video.loop = false;
    video.src = CLIP_1;
    video.play();
  }

  function playClip2() {
    state = 2;
    video.loop = false;
    video.src = CLIP_2;
    video.play();
  }

  playClip1();

  video.addEventListener("ended", () => {
    if (state === 1) playClip2();
    else playClip1();
  });
</script>

</body>
</html>
