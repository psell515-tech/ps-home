<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Patrick Sell - Family Album</title>

<style>
  body {
    margin: 0;
    padding: 0;
    background: #000;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
  }

  /* Shared header styles */
  #header {
    width: 100%;
    background: rgba(255,255,255,0.06);
    border-bottom: 1px solid rgba(255,255,255,0.12);
    backdrop-filter: blur(8px);
    padding: 14px 20px;
    box-sizing: border-box;
    position: relative;
    z-index: 10;

    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  #nav-left {
    display: flex;
    align-items: center;
    gap: 22px;
  }

  .nav-link {
    color: #fff;
    font-size: 16px;
    font-weight: 500;
    text-decoration: none;
    opacity: 0.85;
    transition: opacity 0.2s ease;
  }

  .nav-link:hover {
    opacity: 1;
  }

  /* Page content */
  #player-wrapper {
    margin-top: 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  #mainVideo {
    width: 272px;
    height: 459px;
    border-radius: 14px;
    object-fit: contain;
    background: #000;
    box-shadow: 0 0 18px rgba(0,0,0,0.35);
  }

  #updateNotice {
    margin-top: 18px;
    font-size: 14px;
    letter-spacing: 0.4px;
    color: rgba(255,255,255,0.65);
    text-align: center;
    font-weight: 300;
    max-width: 280px;
    line-height: 1.45;
  }

  #form-wrapper {
    margin-top: 40px;
    width: 90%;
    max-width: 420px;
    text-align: center;
    color: #888;
    font-size: 14px;
  }
</style>
</head>

<body>

<!-- ⭐ SHARED HEADER -->
<div id="header-container"></div>

<script>
  fetch("/header.html")
    .then(r => r.text())
    .then(html => {
      document.getElementById("header-container").innerHTML = html;
    });
</script>

<!-- ⭐ FAMILY PAGE CONTENT -->
<div id="player-wrapper">
  <video id="mainVideo" playsinline autoplay muted></video>

  <div id="updateNotice">
    New family updates are planned for <strong>Summer 2026</strong>.
  </div>
</div>

<div id="form-wrapper">
Check Back Soon.
</div>

<script>
  const video = document.getElementById("mainVideo");

  async function loadVideos() {
    try {
      const res = await fetch(
        "https://hptombstone2work.psell515.workers.dev/list?bucket=psell-family&token=my_subway"
      );

      const files = await res.json();

      // Filter to MP4s
      let videos = files.filter(f => f.toLowerCase().endsWith(".mp4"));

      if (videos.length === 0) {
        console.warn("No videos found in psell-family bucket.");
        return;
      }

      const START_CLIP = "ice-cup.mp4";

      // Remove start clip from list (if present)
      videos = videos.filter(v => v !== START_CLIP);

      // Shuffle remaining videos
      for (let i = videos.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [videos[i], videos[j]] = [videos[j], videos[i]];
      }

      // Build full URLs (start clip first)
      const urls = [
        `https://hptombstone2work.psell515.workers.dev/r2/${START_CLIP}?bucket=psell-family&token=my_subway`,
        ...videos.map(
          key =>
            `https://hptombstone2work.psell515.workers.dev/r2/${key}?bucket=psell-family&token=my_subway`
        )
      ];

      let index = 0;

      function playNext() {
        video.src = urls[index];
        video.play();
        index = (index + 1) % urls.length;
      }

      video.addEventListener("ended", playNext);

      // Start with ice-cup.mp4
      playNext();

    } catch (err) {
      console.error("Error loading videos:", err);
    }
  }

  loadVideos();
</script>

</body>
</html>
