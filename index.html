<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Patrick Sell</title>

<style>
  body {
    margin: 0;
    padding: 0;
    background: #000;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
  }

  /* ---------------------------------------
     HEADER WITH SKILLS WIDGET
  --------------------------------------- */
  #header {
    width: 100%;
    background: rgba(255,255,255,0.06);
    border-bottom: 1px solid rgba(255,255,255,0.12);
    backdrop-filter: blur(8px);
    padding: 14px 20px;
    box-sizing: border-box;
    position: relative;
    z-index: 10;
  }

  #skills-toggle {
    font-size: 17px;
    font-weight: 600;
    cursor: pointer;
    user-select: none;
    color: #fff;
  }

  #skills-panel {
    width: 100%;
    background: rgba(255,255,255,0.04);
    border-bottom: 1px solid rgba(255,255,255,0.12);
    backdrop-filter: blur(8px);
    display: none;
    padding: 14px 20px 20px;
    box-sizing: border-box;
  }

  #skills-panel ul {
    margin: 0;
    padding: 0;
    list-style: none;
  }

  #skills-panel li {
    padding: 6px 0;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    font-size: 15px;
  }

  #skills-panel li:last-child {
    border-bottom: none;
  }

  /* ---------------------------------------
     EXISTING PAGE CONTENT
  --------------------------------------- */
  #player-wrapper {
    margin-top: 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  #mainVideo {
    width: 272px;
    height: 459px;
    border-radius: 14px;
    object-fit: cover;
    background: #000;
    box-shadow: 0 0 18px rgba(0,0,0,0.35);
  }

  #updateNotice {
    margin-top: 18px;
    font-size: 14px;
    letter-spacing: 0.4px;
    color: rgba(255,255,255,0.65);
    text-align: center;
    font-weight: 300;
    max-width: 280px;
    line-height: 1.45;
  }

  #form-wrapper {
    margin-top: 40px;
    width: 90%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  #form-wrapper a {
    color: #888;
    margin-top: 20px;
    font-size: 14px;
    text-align: center;
  }
</style>
</head>

<body>

<!-- ⭐ HEADER WITH SKILLS -->
<div id="header">
  <div id="skills-toggle">Skills & Strengths ▾</div>
</div>

<!-- ⭐ EXPANDING PANEL (pushes content down) -->
<div id="skills-panel">
  <ul id="skills-list"></ul>
</div>

<script>
  const skills = [
    "Cloudflare Workers & R2 Architecture",
    "Full‑stack Web Development",
    "Website Development & Deployment",
    "New Technologies & Emerging Tools",
    "API Design & Automation",
    "Google Sites Custom Embeds",
    "Clean, Minimal UI/UX",
    "Debugging & Systems Thinking",
    "Wiring & Hardware Setup",
    "Drone Operation & Property Management",
    "Video Editing & Media Production",
    "Marketing Intelligence & Analytics",
    "Creative Problem Solving",
    "Political Analysis"
  ];

  document.getElementById("skills-list").innerHTML =
    skills.map(s => `<li>${s}</li>`).join("");

  const toggle = document.getElementById("skills-toggle");
  const panel = document.getElementById("skills-panel");

  toggle.addEventListener("click", () => {
    const open = panel.style.display === "block";
    panel.style.display = open ? "none" : "block";
    toggle.innerHTML = open ? "Skills & Strengths ▾" : "Skills & Strengths ▴";
  });
</script>

<!-- ⭐ EXISTING CONTENT -->
<div id="player-wrapper">
  <video id="mainVideo" playsinline autoplay muted></video>

  <div id="updateNotice">
    New creative updates are planned for <strong>May 2026</strong>.  
    Thank you for visiting.
  </div>
</div>

<div id="form-wrapper">
  <a href="/contact.html">Contact Me</a>
</div>

<script>
  const video = document.getElementById("mainVideo");

  const CLIP_1 = "https://hptombstone2work.psell515.workers.dev/r2/patandcroc-ai.mp4?token=my_subway";
  const CLIP_2 = "https://hptombstone2work.psell515.workers.dev/r2/ps-title-sequence.mp4?token=my_subway";

  let state = 1;

  function playClip1() {
    state = 1;
    video.loop = false;
    video.src = CLIP_1;
    video.play();
  }

  function playClip2() {
    state = 2;
    video.loop = false;
    video.src = CLIP_2;
    video.play();
  }

  playClip1();

  video.addEventListener("ended", () => {
    if (state === 1) playClip2();
    else playClip1();
  });
</script>

</body>
</html>
