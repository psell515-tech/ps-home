<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Patrick Sell</title>

<style>
  body {
    margin: 0;
    padding: 0;
    background: #000;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    height: 100vh;
    overflow-x: hidden;
  }

  /* ------------------------------
     TOP‑RIGHT SKILLS WIDGET
  ------------------------------ */
  #skills-widget {
    position: fixed;
    top: 20px;
    right: 20px;
    width: 260px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 14px;
    padding: 16px 18px;
    color: #fff;
    font-family: inherit;
    backdrop-filter: blur(8px);
    cursor: pointer;
    transition: 0.3s ease;
    z-index: 9999;
  }

  #skills-widget:hover {
    background: rgba(255,255,255,0.14);
  }

  #skills-title {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 10px;
  }

  #skills-list {
    margin: 0;
    padding: 0;
    list-style: none;
    display: none;
    max-height: 260px;
    overflow-y: auto;
  }

  #skills-list li {
    padding: 6px 0;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    font-size: 15px;
  }

  #skills-list li:last-child {
    border-bottom: none;
  }

  /* ------------------------------
     EXISTING PAGE STYLES
  ------------------------------ */
  #player-wrapper {
    margin-top: 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  #mainVideo {
    width: 272px;
    height: 459px;
    border-radius: 14px;
    object-fit: cover;
    background: #000;
    box-shadow: 0 0 18px rgba(0,0,0,0.35);
  }

  #updateNotice {
    margin-top: 18px;
    font-size: 14px;
    letter-spacing: 0.4px;
    color: rgba(255,255,255,0.65);
    text-align: center;
    font-weight: 300;
    max-width: 280px;
    line-height: 1.45;
  }

  #form-wrapper {
    margin-top: 40px;
    width: 90%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  #form-wrapper a {
    color: #888;
    margin-top: 20px;
    font-size: 14px;
    text-align: center;
  }
</style>
</head>

<body>

<!-- ⭐ TOP‑RIGHT SKILLS WIDGET -->
<div id="skills-widget">
  <div id="skills-title">Skills & Strengths</div>
  <ul id="skills-list"></ul>
</div>

<script>
  const skills = [
    "Cloudflare Workers & R2 Architecture",
    "Website Development & Deployment",
    "New Technologies & Emerging Tools",
    "Google Sites Custom Embeds",
    "Clean, Minimal UI/UX",
    "Debugging & Systems Thinking",
    "Wiring & Hardware Setup",
    "Drone Operation & Property Management",
    "Video Editing & Media Production",
    "Marketing Intelligence & Analytics",
    "Creative Problem Solving",
    "Political Analysis",
    "API Design & Automation",
  ];

  document.getElementById("skills-list").innerHTML =
    skills.map(s => `<li>${s}</li>`).join("");

  document.getElementById("skills-widget").addEventListener("click", () => {
    const list = document.getElementById("skills-list");
    list.style.display = list.style.display === "block" ? "none" : "block";
  });
</script>

<!-- ⭐ EXISTING CONTENT -->
<div id="player-wrapper">
  <video id="mainVideo" playsinline autoplay muted></video>

  <div id="updateNotice">
    New creative updates are planned for <strong>May 2026</strong>.  
    Thank you for visiting.
  </div>
</div>

<div id="form-wrapper">
  <a href="/contact.html">Contact Me</a>
</div>

<script>
  const video = document.getElementById("mainVideo");

  const CLIP_1 = "https://hptombstone2work.psell515.workers.dev/r2/patandcroc-ai.mp4?token=my_subway";
  const CLIP_2 = "https://hptombstone2work.psell515.workers.dev/r2/ps-title-sequence.mp4?token=my_subway";

  let state = 1;

  function playClip1() {
    state = 1;
    video.loop = false;
    video.src = CLIP_1;
    video.play();
  }

  function playClip2() {
    state = 2;
    video.loop = false;
    video.src = CLIP_2;
    video.play();
  }

  playClip1();

  video.addEventListener("ended", () => {
    if (state === 1) playClip2();
    else playClip1();
  });
</script>

</body>
</html>
